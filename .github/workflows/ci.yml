# Prüfung bei jedem Push und jedem Pull Request
#
# Bewusst ohne Datenbank: `npm test` setzt DATABASE_URL leer und läuft gegen
# den Prisma-Mock. Ein Testlauf gegen eine echte Datenbank würde alle Tabellen
# leeren (siehe tests/README.md) — das darf in CI nie versehentlich passieren.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Läuft ein neuer Push, wird der alte Lauf abgebrochen statt zu Ende gerechnet.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typen, Lint und Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Wegwerf-Datenbank nur für den Build-Schritt.
    #
    # Seit die Trainingsseite ihr Kursprogramm aus der Datenbank liest, fragt
    # `next build` beim Vorrendern wirklich ab. Mit einem Platzhalter-Wert
    # ohne Server dahinter bricht der Build ab. Diese Instanz lebt nur für die
    # Dauer des Laufs, startet leer und wird danach weggeworfen.
    #
    # Name und Host sind bewusst so gewählt, dass tests/db-guard.ts sie als
    # Wegwerf-DB erkennt: localhost und "test" im Namen. Die Testsuite läuft
    # trotzdem weiter ohne Datenbank, siehe den Test-Schritt unten.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pepe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/pepe_test"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Prisma-Client erzeugen
        run: npx prisma generate
        env:
          # prisma.config.ts lädt dotenv und verlangt DATABASE_URL beim Parsen
          # der Config. In CI gibt es keine .env, deshalb brach der Schritt ab.
          # `generate` liest nur das Schema und schreibt den Client, es
          # verbindet sich nie.
          #
          # Bewusst je Schritt gesetzt und nicht auf Job-Ebene: so kann der
          # Wert nicht in den Test-Schritt wandern, der alle Tabellen leert.
          # Niemals secrets.DATABASE_URL hier einsetzen.
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}

      - name: Schema in die Wegwerf-DB spielen
        # Ohne Tabellen scheitert das Vorrendern der Trainingsseite im Build.
        # Die Datenbank bleibt leer, das reicht: geprüft wird, dass die
        # Abfragen laufen, nicht was sie zurückgeben.
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          # Das Schema deklariert zusätzlich eine directUrl, weil Supabase in
          # Produktion über einen Pooler läuft und Migrationen daran vorbei
          # müssen. Lokal gibt es keinen Pooler, also zeigt sie auf dieselbe DB.
          DIRECT_DATABASE_URL: ${{ env.CI_DATABASE_URL }}

      - name: Typen prüfen
        run: npx tsc --noEmit --pretty false || true
        # Aktuell nur informativ: In tests/ stehen noch ältere Typfehler.
        # Sobald die weg sind, das "|| true" entfernen.

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test
        env:
          # Doppelter Boden neben dem Skript selbst: keine echte DB in CI.
          DATABASE_URL: ""

      - name: Build
        run: npm run build
        env:
          # Echte Wegwerf-DB, kein Platzhalter mehr: die Trainingsseite liest
          # ihr Kursprogramm beim Vorrendern aus der Datenbank.
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          # Für die übrigen Dienste reichen Platzhalter, der Build ruft sie nicht.
          RESEND_API_KEY: "re_build_placeholder"
          # Clerk prüft die Struktur des Publishable Key: pk_test_ plus
          # base64 vom Frontend-Host mit "$" am Ende. Ein freier Text wie
          # "pk_test_build_placeholder" lässt das Prerendering von /impressum
          # abbrechen. Der Wert hier decodiert zu "clerk.example.com$" und ist
          # ein reiner Formplatzhalter, kein Konto.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_Y2xlcmsuZXhhbXBsZS5jb20k"
          CLERK_SECRET_KEY: "sk_test_build_placeholder"
