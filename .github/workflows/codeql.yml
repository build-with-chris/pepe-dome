# Schwachstellen im eigenen Code (Injection, XSS, offene Pfade)
#
# Läuft bei jeder Änderung, weil genau dann neue Lücken entstehen können,
# und zusätzlich wöchentlich, weil GitHub die Abfragen laufend erweitert.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # security-and-quality findet mehr als der Standard, dafür auch
          # Stilfragen. Für ein Projekt dieser Grösse gut auszuhalten.
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v4
