# Einmal-Werkzeug: package-lock.json auf Linux auflösen lassen.
#
# Hintergrund: npm nimmt optionale Plattformpakete nur dann vollständig ins
# Lockfile auf, wenn es sie auf der laufenden Plattform auch auswertet. Auf
# macOS bleibt deshalb der Teilbaum unter @unrs/resolver-binding-wasm32-wasi
# unvollständig, der @emnapi/core und @emnapi/runtime auf exakt 1.10.0 pinnt.
# Auf Linux bricht `npm ci` dann mit EUSAGE ab, also genau dort, wo Vercel und
# CI bauen.
#
# Dieser Workflow löst mit vorhandenem Lockfile inkrementell auf (nicht von
# Grund auf, das läuft in einen unabhängigen Peer-Konflikt bei valibot) und
# lädt das Ergebnis als Artefakt hoch. Bewusst kein Commit aus der Pipeline
# heraus: das Lockfile wird lokal geprüft und von Hand committet.
#
# Nach Gebrauch löschen.
name: Lockfile auf Linux auflösen

on:
  workflow_dispatch:

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Zustand vorher zeigen
        run: |
          echo "--- npm ci gegen das aktuelle Lockfile (soll fehlschlagen) ---"
          npm ci --dry-run 2>&1 | tail -20 || true

      - name: Lockfile inkrementell auflösen
        run: npm install --package-lock-only

      - name: Gegenprobe
        run: |
          echo "--- npm ci gegen das neue Lockfile (soll durchlaufen) ---"
          npm ci --dry-run 2>&1 | tail -5
          echo "--- emnapi-Einträge ---"
          node -e "
            const p = require('./package-lock.json').packages;
            for (const [k, v] of Object.entries(p)) {
              if (k.includes('emnapi')) console.log(k, '=', v.version);
            }
          "

      - uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          retention-days: 1
