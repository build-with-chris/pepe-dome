# Wöchentliche Sicherheitsprüfung
#
# audit schaut nach bekannten Schwachstellen in den Abhängigkeiten.
# Die Suche im eigenen Code (CodeQL) steht in codeql.yml.
#
# Der Zeitplan ist der eigentliche Punkt. Ein Audit, das nur läuft, wenn jemand
# daran denkt, läuft nicht. Beim ersten Audit dieses Projekts lagen 29 offene
# Schwachstellen bereit, sechs davon kritisch — keine davon hatte jemand
# absichtlich übersehen, es hatte nur nie jemand nachgesehen.

name: Security

# Wann das Audit läuft: wöchentlich, von Hand und nur dann bei Push oder PR,
# wenn sich package.json oder package-lock.json ändert. Neue Advisories
# erscheinen unabhängig von unseren Commits. Lief das Audit bei jedem Push,
# färbte eine frisch gemeldete Lücke jeden Vertrags- oder Textcommit rot,
# und nach ein paar Tagen sah niemand mehr hin. CodeQL prüft den eigenen
# Code und läuft deshalb in codeql.yml bei jeder Änderung.

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/security.yml
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/security.yml
  schedule:
    # Montags 05:30 UTC. Der Bericht liegt vor dem Wochenanfang bereit.
    - cron: "30 5 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Schwachstellen in Produktions-Abhängigkeiten
        # Nur --omit=dev: Lücken in Lint- und Testwerkzeugen laufen nie auf dem
        # Server und sollen den Build nicht rot färben. Sie tauchen im Bericht
        # des nächsten Schritts trotzdem auf.
        run: npm audit --omit=dev --audit-level=high

      - name: Vollständiger Bericht (nur zur Ansicht)
        if: always()
        run: npm audit || true
